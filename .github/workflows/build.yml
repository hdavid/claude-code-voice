name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # The plugin never speaks for permission dialogs; this fails if that hook comes back.
      - name: No permission alert
        run: scripts/check-no-permission-alert.sh

      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version

      # Ad-hoc signed, not notarized: proves the project builds. Releases come from release.yml.
      - name: Build and package
        run: scripts/package.sh

      - uses: actions/upload-artifact@v5
        with:
          name: Claude-Voice-unsigned
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1 # only proves the build; releases come from release.yml
