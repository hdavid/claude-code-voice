name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version

      # Ad-hoc signed, not notarized: proves the project builds. Releases come from release.yml.
      - name: Build and package
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Voice-unsigned
          path: dist/*.zip
          if-no-files-found: error
